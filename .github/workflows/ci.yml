name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          ./godot --version
      - name: Import project (fails on script errors)
        run: |
          ./godot --headless --path . --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log
      - name: Tests (GUT)
        run: ./godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit
      - name: Screenshots (Xvfb + software OpenGL)
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./godot --path . --rendering-driver opengl3 \
            --resolution 1280x720 res://tools/screenshot.tscn -- --out="$PWD/screenshots" --log-preview 2>&1 | tee shot.log
          ! grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error" shot.log
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error
